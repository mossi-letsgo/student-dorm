<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สมัครสมาชิก</title>

    <link rel="stylesheet" href="../css/regsiter.css">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="register-page">

<form class="register-box">

    <h2>สมัครสมาชิก</h2>

    <p class="subtitle">
        ระบบจัดการหอพักนักศึกษา
    </p>

    <!-- ชื่อ -->

    <div class="input-group">

        <label>ชื่อ - นามสกุล</label>

        <input
            type="text"
            id="fullname"
            placeholder="กรอกชื่อ - นามสกุล"
            required>

    </div>

    <!-- รหัสนักศึกษา -->

    <div class="input-group">

        <label>รหัสนักศึกษา</label>

        <input
            type="text"
            id="studentId"
            placeholder="เช่น 66338010001"
            required>

    </div>

    <!-- ระดับการศึกษา -->

    <div class="input-group">

        <label>ระดับการศึกษา</label>

        <select id="education" required>

            <option value="">-- เลือกระดับการศึกษา --</option>

            <option value="ปวช.">ประกาศนียบัตรวิชาชีพ (ปวช.)</option>

            <option value="ปวส.">ประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.)</option>

        </select>

    </div>

    <!-- ระดับชั้น -->

    <div class="input-group">

        <label>ระดับชั้น</label>

        <select id="level" disabled>

            <option value="">-- เลือกระดับชั้น --</option>

        </select>

    </div>

    <!-- สาขา -->

    <div class="input-group">

        <label>สาขา</label>

        <select id="major" disabled>

            <option value="">-- เลือกสาขา --</option>

        </select>

    </div>

    <!-- เบอร์โทร -->

    <div class="input-group">

        <label>เบอร์โทรศัพท์</label>

        <input
            type="tel"
            id="phone"
            maxlength="10"
            placeholder="08xxxxxxxx"
            required>

    </div>

    <!-- Email -->

    <div class="input-group">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            required>

    </div>

    <!-- Password -->

    <div class="input-group">

        <label>รหัสผ่าน</label>

        <input
            type="password"
            id="password"
            placeholder="อย่างน้อย 6 ตัวอักษร"
            required>

    </div>

    <!-- Confirm Password -->

    <div class="input-group">

        <label>ยืนยันรหัสผ่าน</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            required>

    </div>

    <!-- สมัคร -->

    <button
        type="button"
        class="register-btn"
        id="registerBtn">

        สมัครสมาชิก

    </button>

    <div class="bottom-text">

        มีบัญชีอยู่แล้ว ?

        <a href="login.html">

            เข้าสู่ระบบ

        </a>

    </div>

</form>

<script type="module" src="../js/register.js"></script>

</body>
</html>
