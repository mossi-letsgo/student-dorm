<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard | ระบบหอพักนักศึกษา</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<!-- =====================================================
     MOBILE MENU BUTTON
===================================================== -->

<button
    id="menuToggle"
    class="menu-toggle"
    aria-label="เปิดเมนู">

    <i class="fa-solid fa-bars"></i>

</button>


<!-- =====================================================
     SIDEBAR OVERLAY
===================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    id="sidebar">


    <!-- LOGO -->

    <div class="logo">

        🏢 OWNER PANEL

    </div>


    <!-- MENU -->

    <ul>


        <!-- Dashboard -->

        <li class="active">

            <a href="admin-dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    Dashboard
                </span>

            </a>

        </li>


        <!-- Booking -->

        <li>

            <a href="admin-bookings.html">

                <i class="fa-solid fa-calendar-check"></i>

                <span>
                    คำขอจองห้อง
                </span>

            </a>

        </li>


        <!-- Leave -->

        <li>

            <a href="admin-leave.html">

                <i class="fa-solid fa-person-walking-arrow-right"></i>

                <span>
                    คำขอเลิกเช่า
                </span>

            </a>

        </li>


        <!-- Repair -->

        <li>

            <a href="admin-repair.html">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <span>
                    แจ้งซ่อม
                </span>

            </a>

        </li>

          <li class="active">

            <a href="owner-cpayment.html">

                <i class="fa-solid fa-file-invoice-dollar"></i>

                <span>
                    สร้างบิลค่าเช่า
                </span>

            </a>

        </li>


        <!-- Profile -->

        <li>

            <a href="admin-profile.html">

                <i class="fa-solid fa-user-gear"></i>

                <span>
                    โปรไฟล์
                </span>

            </a>

        </li>


        <!-- Logout -->

        <li>

            <a
                href="#"
                id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    ออกจากระบบ
                </span>

            </a>

        </li>


    </ul>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


    <!-- =================================================
         TOPBAR
    ================================================= -->

    <div class="topbar">

        <div>

            <h2>
                Owner Dashboard
            </h2>

            <p id="adminName">
                กำลังโหลดข้อมูล...
            </p>

        </div>

    </div>


    <!-- =================================================
         CARDS
    ================================================= -->

    <div class="cards">


        <!-- USERS -->

        <div class="card">

            <i class="fa-solid fa-users"></i>

            <h3>
                ผู้เช่าทั้งหมด
            </h3>

            <h1 id="totalUser">
                0
            </h1>

        </div>


        <!-- ROOMS -->

        <div class="card">

            <i class="fa-solid fa-bed"></i>

            <h3>
                ห้องทั้งหมด
            </h3>

            <h1 id="totalRooms">
                0
            </h1>

        </div>


        <!-- REPAIR -->

        <div class="card">

            <i class="fa-solid fa-screwdriver-wrench"></i>

            <h3>
                แจ้งซ่อม
            </h3>

            <h1 id="totalRepairs">
                0
            </h1>

        </div>


        <!-- INCOME -->

        <div class="card">

            <i class="fa-solid fa-money-bill-wave"></i>

            <h3>
                รายได้รวม
            </h3>

            <h1 id="totalIncome">
                0 บาท
            </h1>

        </div>


    </div>


    <!-- =================================================
         SYSTEM INFO
    ================================================= -->

    <div class="welcome">

        <h2>

            <i class="fa-solid fa-chart-line"></i>

            ข้อมูลระบบ

        </h2>


        <div id="contentBox">

            กำลังโหลดข้อมูล...

        </div>

    </div>


    <!-- =================================================
         NOTIFICATION
    ================================================= -->

    <div class="welcome notification-section">

        <h2>

            <i class="fa-solid fa-bell"></i>

            การแจ้งเตือน

        </h2>


        <div id="notificationContainer">

            <div class="notification-item">

                <i class="fa-solid fa-spinner"></i>

                <p>
                    กำลังโหลดแจ้งเตือน...
                </p>

            </div>

        </div>

    </div>


</div>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script
    type="module"
    src="../js/admin-dashboard.js">
</script>


<script
    type="module"
    src="../js/theme.js">
</script>


<script
    type="module"
    src="../js/owner-notification.js">
</script>


<!-- MOBILE SIDEBAR -->

<script
    src="../js/mobile-menu.js">
</script>

<script
    type="module"
    src="../js/auto-logger.js">
</script>

</body>

</html>
