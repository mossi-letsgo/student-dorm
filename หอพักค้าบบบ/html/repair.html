<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>แจ้งซ่อม</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =====================================================
     MOBILE MENU BUTTON
===================================================== -->

<button
    type="button"
    id="menuToggle"
    class="menu-toggle"
    aria-label="เปิดเมนู"
    aria-expanded="false">

    <i class="fa-solid fa-bars"></i>

</button>


<!-- =====================================================
     SIDEBAR OVERLAY
===================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
    class="sidebar"
    id="sidebar">


    <!-- LOGO -->

    <div class="logo">

        🏢 Dormitory

    </div>


    <!-- MENU -->

    <ul>


        <li>

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    หน้าหลัก
                </span>

            </a>

        </li>


        <li>

            <a href="rooms.html">

                <i class="fa-solid fa-bed"></i>

                <span>
                    ห้องพัก
                </span>

            </a>

        </li>


        <li>

            <a href="booking.html">

                <i class="fa-solid fa-calendar-check"></i>

                <span>
                    จองห้องพัก
                </span>

            </a>

        </li>


        <li class="active">

            <a href="repair.html">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <span>
                    แจ้งซ่อม
                </span>

            </a>

        </li>


        <li>

            <a href="profile.html">

                <i class="fa-solid fa-user"></i>

                <span>
                    โปรไฟล์
                </span>

            </a>

        </li>


        <li>

            <a
                href="#"
                id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    ออกจากระบบ
                </span>

            </a>

        </li>


    </ul>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


    <!-- =================================================
         TOPBAR
    ================================================= -->

    <div class="topbar">

        <div>

            <h2>
                แจ้งซ่อมห้องพัก
            </h2>

            <p id="userName">
                กำลังโหลด...
            </p>

        </div>

    </div>


    <!-- =================================================
         REPAIR FORM
    ================================================= -->

    <div class="welcome">


        <h2>

            <i class="fa-solid fa-screwdriver-wrench"></i>

            แจ้งปัญหาห้องพัก

        </h2>


        <br>


        <!-- ประเภทปัญหา -->

        <label for="problem">
            ประเภทปัญหา
        </label>


        <select id="problem">


            <option value="">
                -- เลือกประเภทปัญหา --
            </option>


            <option value="ไฟฟ้า">
                💡 ไฟฟ้า
            </option>


            <option value="ประปา">
                🚰 ประปา
            </option>


            <option value="เครื่องปรับอากาศ">
                ❄ เครื่องปรับอากาศ
            </option>


            <option value="เฟอร์นิเจอร์">
                🛏 เฟอร์นิเจอร์
            </option>


            <option value="ประตู/หน้าต่าง">
                🚪 ประตู / หน้าต่าง
            </option>


            <option value="อื่น ๆ">
                📌 อื่น ๆ
            </option>


        </select>


        <br>
        <br>


        <!-- รายละเอียด -->

        <label for="detail">
            รายละเอียดปัญหา
        </label>


        <textarea
            id="detail"
            rows="6"
            placeholder="อธิบายปัญหาที่พบ...">
        </textarea>


        <br>
        <br>


        <!-- ส่ง -->

        <button
            type="button"
            id="sendRepairBtn"
            class="btn">


            <i class="fa-solid fa-paper-plane"></i>

            ส่งคำขอแจ้งซ่อม


        </button>


    </div>


    <!-- =================================================
         REPAIR STATUS
    ================================================= -->

    <div class="welcome">


        <h2>

            <i class="fa-solid fa-list-check"></i>

            สถานะการแจ้งซ่อม

        </h2>


        <div id="repairStatus">


            <p
                style="
                margin-top:20px;
                color:#aaa;
                ">

                ยังไม่มีรายการแจ้งซ่อม

            </p>


        </div>


    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->


<!-- Theme -->

<script
    type="module"
    src="../js/theme.js">
</script>


<!-- Repair -->

<script
    type="module"
    src="../js/repair.js">
</script>


<!-- Mobile Sidebar -->

<script
    src="../js/mobile-menu.js">
</script>

<script
    type="module"
    src="../js/auto-logger.js">
</script>

</body>

</html>
