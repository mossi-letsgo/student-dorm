<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Management</title>

    <link rel="stylesheet" href="../css/room-management.css">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-user-shield"></i>

            <div>

                <h2>Super Admin</h2>

                <small>Control Panel</small>

            </div>

        </div>

        <ul>

            <li><a href="superadmin-dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>

            <li><a href="owner-management.html"><i class="fa-solid fa-user-tie"></i> จัดการ Owner</a></li>

            <li><a href="student-management.html"><i class="fa-solid fa-user-graduate"></i> จัดการ Student</a></li>

            <li class="active">
                <a href="room-management.html">
                    <i class="fa-solid fa-bed"></i>
                    จัดการห้องพัก
                </a>
            </li>

            <li><a href="payment-management.html"><i class="fa-solid fa-qrcode"></i> PromptPay</a></li>

            <li><a href="system-setting.html"><i class="fa-solid fa-gear"></i> ตั้งค่าระบบ</a></li>

            <li><a href="system-log.html"><i class="fa-solid fa-clock-rotate-left"></i> Activity Logs</a></li>

        </ul>

        <div class="sidebar-footer">

            <div class="admin-profile">

                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>

                    <h4 id="adminName">กำลังโหลด...</h4>

                    <small>Super Administrator</small>

                </div>

            </div>

            <button id="logoutBtn" class="logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </div>

    <!-- Main -->

    <div class="main">

        <div class="topbar">

            <div>

                <h2>Room Management</h2>

                <p>จัดการข้อมูลห้องพัก</p>

            </div>

        </div>

        <!-- Toolbar -->

        <div class="panel">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchRoom"
                    placeholder="ค้นหาเลขห้อง">

                <select id="roomCategory">

                    <option value="small">ห้องเล็ก</option>

                    <option value="medium">ห้องกลาง</option>

                    <option value="large">ห้องใหญ่</option>

                    <option value="all">ทั้งหมด</option>

                </select>

                <button class="btn" id="addRoomBtn">

                    <i class="fa-solid fa-plus"></i>

                    เพิ่มห้อง

                </button>

            </div>

        </div>

        <!-- Table -->

        <div class="panel">

            <table>

                <thead>

                    <tr>

                        <th>เลขห้อง</th>

                        <th>ชั้น</th>

                        <th>ขนาดห้อง</th>

                        <th>ราคา</th>

                        <th>สถานะ</th>

                        <th>จัดการ</th>

                    </tr>

                </thead>

                <tbody id="roomTable">

                    <tr>

                        <td colspan="6" style="text-align:center">

                            กำลังโหลดข้อมูล...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Modal -->

    <div class="modal" id="roomModal">

        <div class="modal-box">

            <h2>ข้อมูลห้องพัก</h2>

            <input type="hidden" id="roomId">

            <input
                type="text"
                id="roomNumber"
                placeholder="เลขห้อง">

            <input
                type="number"
                id="floor"
                placeholder="ชั้น">

            <select id="roomType">

                <option value="">เลือกขนาดห้อง</option>

                <option value="small">Small</option>

                <option value="medium">Medium</option>

                <option value="large">Large</option>

            </select>

            <input
                type="number"
                id="price"
                placeholder="ราคา">

            <textarea
                id="description"
                placeholder="รายละเอียดห้อง"></textarea>

            <select id="status">

                <option value="available">ว่าง</option>

                <option value="occupied">มีผู้เช่า</option>

                <option value="booked">รออนุมัติ</option>

                <option value="unavailable">ปิดใช้งาน</option>

            </select>

            <div class="modal-footer">

                <button
                    class="btn"
                    id="saveRoomBtn">

                    บันทึก

                </button>

                <button
                    class="btn btn-secondary"
                    onclick="closeRoomModal()">

                    ยกเลิก

                </button>

            </div>

        </div>

    </div>

    <script>
        function closeRoomModal() {
            document.getElementById("roomModal").style.display = "none";
        }
    </script>

    <script type="module" src="../js/room-management.js"></script>

</body>

</html>
