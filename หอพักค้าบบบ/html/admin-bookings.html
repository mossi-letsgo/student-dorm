<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>รายการจองห้องพัก</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<!-- =====================================================
     MOBILE MENU BUTTON
===================================================== -->

<button
    id="menuToggle"
    class="menu-toggle"
    aria-label="เปิดเมนู">

    <i class="fa-solid fa-bars"></i>

</button>


<!-- =====================================================
     SIDEBAR OVERLAY
===================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div
    class="sidebar"
    id="sidebar">


    <!-- LOGO -->

    <div class="logo">

        🏢 OWNER PANEL

    </div>


    <!-- MENU -->

    <ul>


        <!-- DASHBOARD -->

        <li>

            <a href="admin-dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    Dashboard
                </span>

            </a>

        </li>


        <!-- BOOKING -->

        <li class="active">

            <a href="admin-bookings.html">

                <i class="fa-solid fa-calendar-check"></i>

                <span>
                    คำขอจองห้อง
                </span>

            </a>

        </li>


        <!-- LEAVE -->

        <li>

            <a href="admin-leave.html">

                <i class="fa-solid fa-person-walking-arrow-right"></i>

                <span>
                    คำขอเลิกเช่า
                </span>

            </a>

        </li>


        <!-- REPAIR -->

        <li>

            <a href="admin-repair.html">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <span>
                    แจ้งซ่อม
                </span>

            </a>

        </li>


        <!-- PROFILE -->

        <li>

            <a href="admin-profile.html">

                <i class="fa-solid fa-user-gear"></i>

                <span>
                    โปรไฟล์
                </span>

            </a>

        </li>


        <!-- LOGOUT -->

        <li>

            <a
                href="#"
                id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    ออกจากระบบ
                </span>

            </a>

        </li>


    </ul>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


    <!-- =================================================
         TOPBAR
    ================================================= -->

    <div class="topbar">

        <div>

            <h2>
                รายการคำขอจองห้องพัก
            </h2>

            <p id="adminName">
                กำลังโหลด...
            </p>

        </div>

    </div>


    <!-- =================================================
         BOOKING CARDS
    ================================================= -->

    <div class="cards">


        <!-- TOTAL -->

        <div class="card">

            <i class="fa-solid fa-calendar-check"></i>

            <h3>
                คำขอทั้งหมด
            </h3>

            <h1 id="totalBooking">
                0
            </h1>

        </div>


        <!-- PENDING -->

        <div class="card">

            <i class="fa-solid fa-clock"></i>

            <h3>
                รออนุมัติ
            </h3>

            <h1 id="pendingBooking">
                0
            </h1>

        </div>


        <!-- APPROVED -->

        <div class="card">

            <i class="fa-solid fa-circle-check"></i>

            <h3>
                อนุมัติแล้ว
            </h3>

            <h1 id="approvedBooking">
                0
            </h1>

        </div>


        <!-- REJECTED -->

        <div class="card">

            <i class="fa-solid fa-circle-xmark"></i>

            <h3>
                ปฏิเสธ
            </h3>

            <h1 id="rejectedBooking">
                0
            </h1>

        </div>


    </div>


    <!-- =================================================
         BOOKING LIST
    ================================================= -->

    <div class="welcome">

        <h2>

            <i class="fa-solid fa-list"></i>

            รายการคำขอจอง

        </h2>


        <div
            id="bookingContainer"
            class="booking-grid">

            <p>
                กำลังโหลดข้อมูล...
            </p>

        </div>

    </div>


    <!-- =================================================
         NOTIFICATION
    ================================================= -->

    <div class="welcome">

        <h2>

            <i class="fa-solid fa-bell"></i>

            การแจ้งเตือนล่าสุด

        </h2>


        <div id="notificationContainer">

            <p>
                กำลังโหลดแจ้งเตือน...
            </p>

        </div>

    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<!-- ระบบคำขอจอง -->

<script
    type="module"
    src="../js/admin-bookings.js">
</script>


<!-- ระบบแจ้งเตือน Owner -->

<script
    type="module"
    src="../js/owner-notification.js">
</script>


<!-- Theme -->

<script
    type="module"
    src="../js/theme.js">
</script>


<!-- Mobile Sidebar -->

<script
    src="../js/mobile-menu.js">
</script>

<script
    type="module"
    src="../js/auto-logger.js">
</script>

</body>

</html>
