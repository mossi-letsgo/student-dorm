<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>จัดการแจ้งซ่อม</title>


    <!-- ================= CSS ================= -->

    <link
        rel="stylesheet"
        href="../css/dashboard.css">


    <!-- ================= GOOGLE FONT ================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ================= FONT AWESOME ================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =====================================================
     MOBILE MENU BUTTON
===================================================== -->

<button
    id="menuToggle"
    class="menu-toggle"
    type="button"
    aria-label="เปิดเมนู"
    aria-expanded="false">

    <i class="fa-solid fa-bars"></i>

</button>


<!-- =====================================================
     SIDEBAR OVERLAY
===================================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay">
</div>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">


    <!-- LOGO -->

    <div class="logo">

        🏢 OWNER PANEL

    </div>


    <!-- MENU -->

    <ul>


        <!-- Dashboard -->

        <li>

            <a href="admin-dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>
                    Dashboard
                </span>

            </a>

        </li>


        <!-- Bookings -->

        <li>

            <a href="admin-bookings.html">

                <i class="fa-solid fa-calendar-check"></i>

                <span>
                    คำขอจองห้อง
                </span>

            </a>

        </li>


        <!-- Leave -->

        <li>

            <a href="admin-leave.html">

                <i class="fa-solid fa-person-walking-arrow-right"></i>

                <span>
                    คำขอเลิกเช่า
                </span>

            </a>

        </li>


        <!-- Repair -->

        <li class="active">

            <a href="admin-repair.html">

                <i class="fa-solid fa-screwdriver-wrench"></i>

                <span>
                    แจ้งซ่อม
                </span>

            </a>

        </li>

          <li class="active">

            <a href="owner-cpayment.html">

                <i class="fa-solid fa-file-invoice-dollar"></i>

                <span>
                    สร้างบิลค่าเช่า
                </span>

            </a>

        </li>


        <!-- Profile -->

        <li>

            <a href="admin-profile.html">

                <i class="fa-solid fa-user-gear"></i>

                <span>
                    โปรไฟล์
                </span>

            </a>

        </li>


        <!-- Logout -->

        <li>

            <a
                href="#"
                id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    ออกจากระบบ
                </span>

            </a>

        </li>


    </ul>

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


    <!-- =================================================
         TOPBAR
    ================================================= -->

    <div class="topbar">


        <div>

            <h2>
                จัดการแจ้งซ่อม
            </h2>


            <p id="adminName">

                Loading...

            </p>

        </div>


    </div>



    <!-- =================================================
         SUMMARY CARDS
    ================================================= -->

    <div class="cards">


        <!-- ================= ALL ================= -->

        <div class="card">

            <i class="fa-solid fa-screwdriver-wrench"></i>


            <h3>
                รายการทั้งหมด
            </h3>


            <h1 id="totalRepair">
                0
            </h1>

        </div>



        <!-- ================= PENDING ================= -->

        <div class="card">

            <i class="fa-solid fa-hourglass-half"></i>


            <h3>
                รอดำเนินการ
            </h3>


            <h1 id="pendingRepair">
                0
            </h1>

        </div>



        <!-- ================= REPAIRING ================= -->

        <div class="card">

            <i class="fa-solid fa-hammer"></i>


            <h3>
                กำลังซ่อม
            </h3>


            <h1 id="repairingRepair">
                0
            </h1>

        </div>



        <!-- ================= COMPLETED ================= -->

        <div class="card">

            <i class="fa-solid fa-circle-check"></i>


            <h3>
                ซ่อมเสร็จ
            </h3>


            <h1 id="completedRepair">
                0
            </h1>

        </div>


    </div>



    <!-- =================================================
         REPAIR LIST
    ================================================= -->

    <div class="welcome">


        <h2>

            <i class="fa-solid fa-list-check"></i>

            รายการแจ้งซ่อม

        </h2>


        <br>


        <div id="repairContainer">

            กำลังโหลด...

        </div>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->


<!-- Admin Repair -->

<script
    type="module"
    src="../js/admin-repair.js">
</script>


<!-- Theme -->

<script
    type="module"
    src="../js/theme.js">
</script>


<!-- Admin Dashboard -->

<script
    type="module"
    src="../js/admin-dashboard.js">
</script>


<!-- Owner Notification -->

<script
    type="module"
    src="../js/owner-notification.js">
</script>


<!-- Mobile Sidebar -->

<script
    src="../js/mobile-menu.js">
</script>

<script
    type="module"
    src="../js/auto-logger.js">
</script>

</body>

</html>
